tests:
  cpp.libcxx.filesystem:
    tags:
      - cpp
      - libcxx
      - filesystem
    modules:
      - littlefs
    toolchain_allow:
      - zephyr/gnu
      - zephyr/llvm
    integration_platforms:
      - mps2/an385
    min_ram: 256
    timeout: 120
