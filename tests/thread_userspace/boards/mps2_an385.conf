# Cortex-M3 has eight MPU regions. Ztest adds a fourth application partition
# (libc, malloc, runtime, test harness), so its optional privileged-stack guard
# would exceed the hardware budget. User/kernel and private user-stack
# isolation remain enabled. The non-Ztest sample can retain stack protection.
CONFIG_TEST_HW_STACK_PROTECTION=n
