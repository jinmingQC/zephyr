tests:
  debug.kasan.global:
    tags: debug kasan
    toolchain_allow:
      - zephyr/gnu
      - host/llvm
    # RX does not support -fsanitize=kernel-address.
    filter: not CONFIG_RX
    integration_platforms:
      - qemu_riscv32
      - qemu_cortex_m3
      - qemu_cortex_a53
      - qemu_x86_64
      - native_sim/native/64
